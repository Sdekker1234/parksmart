# Bouwt ParkSmart als statische site en zet die op GitHub Pages.
# Eenmalig nodig: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Online zetten (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *' # elk half uur: bezetting P+R verversen
    - cron: '15 3 * * *' # elke nacht: tarieven, locaties en bedrijven verversen
  workflow_dispatch:

permissions:
  contents: write # om de meetreeks bezetting in de branch "bezetting" bij te schrijven
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Het AI-model (±135 MB) bewaren tussen runs; alleen nodig als de AI-zoeklijst opnieuw moet
      - name: AI-model uit de cache
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: hf-paraphrase-multilingual-MiniLM-L12-v2-2c4055b1

      # De nieuwste momentopname van de vorige run terugzetten. Zonder deze stap bouwde elke run van het
      # halfuur de site opnieuw met de oude data uit de repo, en verdwenen 's nachts ververste tarieven.
      - name: Laatste momentopname uit de cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/snapshot
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-
      - name: Nieuwste data per bron kiezen (repo of vorige run)
        run: node scripts/merge-snapshot.js .cache/snapshot

      - name: Tarieven, locaties en bedrijven verversen
        if: github.event_name != 'schedule' || github.event.schedule == '15 3 * * *'
        run: node scripts/make-snapshot.js --keep-on-error

      - name: AI-zoeklijst bijwerken (alleen als de bedrijven veranderd zijn)
        run: node scripts/build-semantic.js --keep-on-error

      - name: Bezetting P+R ophalen
        run: node scripts/fetch-live.js || echo "Bezetting nu niet beschikbaar"

      # Meetreeks voor de voorspelling: nieuwe standen als regels in een CSV in de branch "bezetting".
      # Mag mislukken zonder dat de site niet online komt.
      - name: Bezetting bewaren (meetreeks voor de voorspelling)
        continue-on-error: true
        run: |
          test -f data/live.json || { echo "Geen live.json, niets te bewaren"; exit 0; }
          git fetch --depth=1 origin bezetting
          git worktree add --detach ../bezetting FETCH_HEAD
          node scripts/record-occupancy.js ../bezetting
          cd ../bezetting
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Geen nieuwe metingen"; exit 0; fi
          git commit -q -m "Bezetting $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:bezetting && exit 0
            git fetch --depth=20 origin bezetting && git rebase -q FETCH_HEAD
          done
          exit 1

      - name: Tariefregels, parser, openingstijden en AI-zoeken testen
        run: node --test server/pricing.test.js shared/rules.test.js shared/hours.test.js shared/bot.test.js shared/semantic.test.js shared/honesty.test.js

      - run: npm run build:pages

      - name: Momentopname bewaren voor de volgende run
        run: rm -rf .cache/snapshot && mkdir -p .cache && cp -r data/snapshot .cache/snapshot
      - uses: actions/cache/save@v4
        with:
          path: .cache/snapshot
          key: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
